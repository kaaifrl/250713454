<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<!-- Deklarasi XHTML, dengan dasar aturannya adalah HTML yang mengikuti aturan XML -->
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>My First Page</title>
</head>
<!-- Bagian kepala halaman. Informasi dapat dilihat pada jendela halaman website, dimana judul halaman akan ditampilkan -->
<body style="background-color: antiquewhite;
text-align: center;">
    <!-- style yang diatur pada body adalah warna latar belakang dan posisi teks -->
    <h1 style="font-family: 'Times New Roman', Times, serif;
    color: goldenrod;
    border: 2px solid burlywood;">Heading 1 Saya</h1>
    <!-- style yang diatur pada h1 adalah jenis font, warna teks, dan border -->
    <h2 style="font-family: Georgia, 'Times New Roman', Times, serif;
    border: 1px solid darksalmon;
    color: chocolate;">Heading 2 Saya</h2>
    <!-- style yang diatur pada h2 adalah jenis font, border, dan warna teks -->
    <p style="background-color: beige;
    border: 1px solid brown;
    border-radius: 3px;
    color: maroon;">Ini adalah <strong>paragraf</strong> saya</p>
    <!-- style yang diatur pada p adalah letak teks, warna kotak, border, kelengkungan sudut border, dan warna teks -->
</body>
<!-- Bagian tubuh halaman. Ini adalah bagian yang berisi informasi yang akan ditampilkan kepada pengguna -->
</html>
