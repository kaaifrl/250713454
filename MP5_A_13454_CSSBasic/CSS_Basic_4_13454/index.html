<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Gambar Link Saya</title>

    <!-- ===== LINKED STYLE SHEET ===== -->
    <link rel="stylesheet" type="text/css" href="style.css" />

    <!-- ===== EMBEDDED STYLE SHEET ===== -->
    <style type="text/css">
        /* Selector 1: body */
        body {
            background-color: #f5f0e6;
            font-family: Georgia, 'Times New Roman', serif;
            margin: 30px;
            padding: 20px;
        }

        /* Selector 2: h1 */
        h1 {
            color: #1a3c6e;
            text-align: center;
            border-bottom: 3px solid #f0b429;
            padding-bottom: 10px;
            letter-spacing: 1px;
        }

        /* Selector 3: p */
        p {
            color: #333333;
            font-size: 16px;
            line-height: 1.6;
            text-align: center;
            background-color: #ffffff;
            padding: 12px 20px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <!-- ===== INLINE STYLE SHEET ===== -->
    <!-- Selector 1: h1 (inline) -->
    <h1 style="font-size: 32px; text-shadow: 1px 1px 2px #cccccc;">
        Website Informatika UAJY
    </h1>

    <!-- Selector 2: p (inline) -->
    <p style="font-style: italic; border: 1px solid #f0b429;">
        Klik gambar dibawah ini untuk masuk ke halaman website
    </p>

    <!-- Selector 3: a (inline) -->
    <a href="https://inf.uajy.ac.id/"
       style="display: block; text-align: center; text-decoration: none;">
        <img src="https://pawon.uajy.ac.id/images/article/UAJY-LOGO-UNIV_-VERTICAL-STACK-UP_-012.png"
             alt="Gambar Logo UAJY" height="200px" width="400px" />
    </a>
</body>

</html>
